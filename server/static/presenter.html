<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podium</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; overscroll-behavior: none; }
  body {
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 28px 24px calc(24px + env(safe-area-inset-bottom));
    font: 400 16px/1.15 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #cue {
    flex: 1; display: flex; align-items: center;
    font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05;
    opacity: 0; transition: opacity .25s ease;
  }
  #cue.on { opacity: 1; }
  #bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  #clock { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #clock.over { color: #ff4d4d; }
  #section { font-size: 15px; color: #6e6e78; text-align: right; max-width: 45%; }
  #bar { height: 3px; background: #1c1c22; margin-top: 14px; display: flex; gap: 2px; }
  #bar div { flex: 1; background: #2a2a33; }
  #dead { position: fixed; top: 10px; right: 14px; font-size: 12px; color: #ff4d4d; display: none; }
</style>
</head>
<body>
  <div id="dead">no server</div>
  <div id="cue"></div>
  <div id="bottom">
    <div id="clock">--:--</div>
    <div id="section"></div>
  </div>
  <div id="bar"></div>
<script>
const POLL_MS = 2000;
const cueEl = document.getElementById("cue");
const clockEl = document.getElementById("clock");
const sectionEl = document.getElementById("section");
const barEl = document.getElementById("bar");
const deadEl = document.getElementById("dead");

let shownAt = 0;
let shownText = "";
let showForMs = 15000;

function mmss(seconds) {
  const negative = seconds < 0;
  const s = Math.abs(Math.round(seconds));
  const text = String(Math.floor(s / 60)) + ":" + String(s % 60).padStart(2, "0");
  return negative ? "+" + text : text;
}

function drawEngagement(series) {
  // A thin bar per sample, brighter with higher engagement. No axes, no numbers.
  barEl.innerHTML = "";
  series.slice(-40).forEach((point) => {
    const cell = document.createElement("div");
    const score = point.score;
    cell.style.background = score === null || score === undefined
      ? "#2a2a33"
      : "rgba(255,255,255," + (0.12 + 0.2 * score) + ")";
    barEl.appendChild(cell);
  });
}

async function tick() {
  let state;
  try {
    const res = await fetch("/state", { cache: "no-store" });
    state = await res.json();
    deadEl.style.display = "none";
  } catch (err) {
    // A dead server must never blank the countdown: keep the last one on screen.
    deadEl.style.display = "block";
    return;
  }

  const session = state.session || {};
  if (session.remaining_s === null || session.remaining_s === undefined) {
    clockEl.textContent = mmss(session.elapsed_s || 0);
    clockEl.classList.remove("over");
  } else {
    clockEl.textContent = mmss(session.remaining_s);
    clockEl.classList.toggle("over", session.remaining_s <= 0);
  }
  sectionEl.textContent = session.current_section || "";

  const cue = state.cue;
  if (cue && cue.text && cue.text !== shownText) {
    shownText = cue.text;
    shownAt = Date.now();
    cueEl.textContent = cue.text;
    cueEl.classList.add("on");
    if (navigator.vibrate) navigator.vibrate(40);
  }
  if (shownText && Date.now() - shownAt > showForMs) {
    cueEl.classList.remove("on");
    shownText = "";
  }

  drawEngagement((state.engagement && state.engagement.series) || []);
}

async function keepAwake() {
  try {
    await navigator.wakeLock.request("screen");
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") keepAwake();
    });
  } catch (err) { /* Auto-Lock Never is the fallback */ }
}

document.body.addEventListener("click", keepAwake, { once: true });
keepAwake();
tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
